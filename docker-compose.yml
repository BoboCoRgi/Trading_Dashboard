services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: invest
      POSTGRES_PASSWORD: invest
      POSTGRES_DB: investment_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest -d investment_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:

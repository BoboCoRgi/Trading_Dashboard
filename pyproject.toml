[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-intelligence"
version = "0.1.0"
description = "Personal investment decision-intelligence system. Read-only brokers. No order execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.1",
    "streamlit>=1.40",
    "plotly>=5.24",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=1.40",
]
dev = [
    "pytest>=8.3",
    "anthropic>=0.40",
    "openai>=1.55",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "ai*",
    "analytics*",
    "connectors*",
    "core*",
    "db*",
    "journal*",
    "research*",
    "scripts*",
    "services*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
